name: Brussels landmark snapshots
on:
  pull_request:
    branches: [main]
    paths:
      - "snapshot-grand-place.html"
      - "snapshot-royal-palace.html"
      - "js/brussels-landmarks.js"
      - "tests/grand-place.test.mjs"
      - ".github/workflows/brussels-landmark-snapshots.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  grand-place:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The published site assets only change when the geodata pipeline changes, so they
      # are cached on those inputs; landmark-only PRs reuse them instead of re-downloading.
      - name: Restore published Brussels map assets
        id: site-assets-cache
        uses: actions/cache@v4
        with:
          path: |
            data/brussels-build/
            data/brussels-terrain/
          key: site-assets-v1-${{ hashFiles('tools/build-brussels-geodata.mjs', 'tools/build-brussels-base-geodata.mjs', 'tools/geo-brussels-base-*.mjs', 'tools/osm-pbf-extract.mjs', 'js/brx-geodata.js', 'js/brussels-terrain.js') }}
      - name: Fetch generated Brussels map assets from the published site
        if: steps.site-assets-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/brussels-build data/brussels-terrain
          base="https://hartraft.github.io/bxl-loop"
          for file in brx-geo.json brx-buildings.bin; do
            curl --fail --location --retry 4 "$base/data/brussels-build/$file" -o "data/brussels-build/$file"
          done
          for file in metadata.json heightmap.f32; do
            curl --fail --location --retry 4 "$base/data/brussels-terrain/$file" -o "data/brussels-terrain/$file"
          done
      - name: Check landmark source syntax, Grand-Place and Royal Palace geometry
        run: |
          node --check js/brussels-landmarks.js
          node --test tests/grand-place.test.mjs tests/brussels-royal-palace.test.mjs tests/brussels-landmark-colliders.test.mjs
      - name: Cache Playwright Chromium binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('tools/shot.py') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-
      - name: Install Playwright
        run: |
          python -m pip install playwright
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            python -m playwright install chromium
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Capture Grand-Place Town Hall
        run: |
          mkdir -p artifacts
          python -m http.server 4173 > /tmp/snapshot-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 30); do curl --fail http://localhost:4173/snapshot-grand-place.html >/dev/null && break || sleep 1; done
          python tools/shot.py http://localhost:4173/snapshot-grand-place.html artifacts/brussels-grand-place-town-hall.png 12
      - name: Capture Royal Palace north façade
        run: |
          mkdir -p artifacts
          python -m http.server 4173 > /tmp/snapshot-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 30); do curl --fail http://localhost:4173/snapshot-royal-palace.html >/dev/null && break || sleep 1; done
          python tools/shot.py http://localhost:4173/snapshot-royal-palace.html artifacts/brussels-royal-palace.png 12
      - uses: actions/upload-artifact@v4
        with:
          name: brussels-landmark-elevations
          path: |
            artifacts/brussels-grand-place-town-hall.png
            artifacts/brussels-royal-palace.png
          if-no-files-found: error
          retention-days: 30
