name: Brussels rendered-scene screenshots

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/brussels-browser-screenshots.yml"
      - "index.html"
      - "css/**"
      - "js/**"
      - "data/**"
      - "vendor/**"
      - "assets/**"
      - "models/**"
      - "textures/**"
      - "tools/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brussels-rendered-scenes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rendered-scenes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the pull request source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python for Brussels terrain generation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore Brussels source data and generated assets
        id: brussels-cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/brussels-dtm-5m.tif
            tools/data/belgium-latest.osm.pbf
            data/brussels-terrain/
            data/brussels-build/
          key: brussels-build-v1-${{ hashFiles('tools/**', '!tools/browser-screenshots.mjs', 'js/brussels-terrain.js') }}
      - name: Install terrain generation dependencies
        run: python -m pip install --only-binary=:all: -r tools/requirements-terrain.txt
      - name: Download and validate the official Brussels DTM
        if: steps.brussels-cache.outputs.cache-hit != 'true'
        run: |
          python tools/download-brussels-dtm.py --resolution 5 --timeout 600 --output /tmp/brussels-dtm-5m.tif
          python tools/prepare-brussels-terrain.py /tmp/brussels-dtm-5m.tif --resolution 5 --output data/brussels-terrain
          python tools/validate-brussels-dtm.py data/brussels-terrain
      - name: Download the Belgium OpenStreetMap extract
        if: steps.brussels-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p tools/data
          curl --fail --location --retry 10 --retry-connrefused --retry-delay 5 --retry-max-time 300 --connect-timeout 30 --max-time 900 \
            https://download.geofabrik.de/europe/belgium-latest.osm.pbf \
            --output tools/data/belgium-latest.osm.pbf
      - name: Build Brussels geodata
        if: steps.brussels-cache.outputs.cache-hit != 'true'
        run: node --max-old-space-size=6144 tools/build-brussels-geodata.mjs
      - name: Validate generated Brussels geodata
        run: |
          node tools/validate-brussels-geodata.mjs data/brussels-build
          node --test tests/geodata-brussels-base.test.mjs
      - name: Smoke-test the Brussels runtime
        run: node tests/brussels-runtime-smoke.mjs
      - name: Stage the same static site and generated terrain used by Pages
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='tools/' \
            --exclude='tests/' \
            --exclude='data/brussels-build/' \
            --exclude='BRUSSELS-PORT.md' \
            --exclude='*.md' \
            ./ _site/
          mkdir -p _site/data/brussels-build
          cp data/brussels-build/brx-geo.json data/brussels-build/brx-buildings.bin _site/data/brussels-build/
          mkdir -p _site/data/brussels-terrain
          cp data/brussels-terrain/metadata.json data/brussels-terrain/heightmap.f32 _site/data/brussels-terrain/
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = '_site/index.html';
          let html = fs.readFileSync(file, 'utf8');
          const redirect = `<script>
          if (!new URLSearchParams(location.search).has('city')) {
            const url = new URL(location.href);
            url.searchParams.set('city', 'brussels');
            location.replace(url.href);
          }
          </script>`;
          if (!html.includes("url.searchParams.set('city', 'brussels')")) {
            html = html.replace('<head>', '<head>\\n  ' + redirect);
            fs.writeFileSync(file, html);
          }
          NODE
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start the staged site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory _site >/tmp/brussels-browser-server.log 2>&1 &
          echo $! >/tmp/brussels-browser-server.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/brussels-browser-server.log
          exit 1
      - name: Capture and validate all six rendered Brussels views
        run: node tools/browser-screenshots.mjs --base-url http://127.0.0.1:4173/
      - name: Upload screenshots and diagnostics, including partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brussels-rendered-scenes-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: artifacts/browser-screenshots/
          if-no-files-found: error
          retention-days: 14
