name: Brussels frame checks

on:
  push:
    branches: [main, "feat/brussels-world-port"]
  pull_request:
    branches: [main]

jobs:
  frame:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check frame module syntax
        run: node --check js/brussels-frame.js
      - name: Test Brussels frame and anchors
        run: node --test tests/brussels-frame.test.mjs
