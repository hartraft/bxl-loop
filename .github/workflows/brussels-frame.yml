name: Brussels frame checks

on:
  push:
    branches: [main, "feat/brussels-world-port"]
  pull_request:
    branches: [main]

jobs:
  frame:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Brussels build pipeline syntax
        run: node --check tools/osm-pbf-extract.mjs && node --check tools/build-brussels-geodata.mjs && node --check tools/validate-brussels-geodata.mjs && node --check tools/build-london-geodata.mjs && node --check tools/geo-london-areas.mjs && node --check tools/geo-london-lines.mjs && node --check js/geo-frame.js
      - name: Test Brussels frame and anchors
        run: node --test tests/brussels-frame.test.mjs tests/brussels-build-frame.test.mjs
