name: Brussels frame checks
# Feature branches run the Belgian street-infrastructure regression suite.

on:
  push:
    branches: [main, "feat/*", "fix/*", "improve/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frame:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-terrain.txt
      - name: Check Brussels build pipeline syntax
        run: |
          node --check tools/osm-pbf-extract.mjs
          node --check tools/build-brussels-geodata.mjs
          node --check tools/validate-brussels-geodata.mjs
          node --check js/brx-geodata.js
          node --check js/brussels-config.js
          node --check js/city-config.js
          node --check js/brussels-landmarks.js
          node --check js/main.js
          node --check js/scene-culling.js
          node --check js/culling-math.mjs
          node --check tests/scene-culling-math.test.mjs
          node --check js/lighting.js
          if [ -f tools/browser-screenshots.mjs ]; then
            node --check tools/browser-screenshots.mjs
          else
            echo 'Capture runner is supplied by the implementation PR; skipping this check here.'
          fi
          node --check js/road-reflections.js
          node --check js/city/materials.js
          node --check js/cameras.js
          node --check js/brussels-map.js
          node --check js/traffic.js
          node --check js/brussels-bus.js
          node --check js/street-details.js
          node --check js/tsl-materials.js
          node --check js/city/roads.js
          node --check js/brussels-city.js
          node --check js/controllers.js
          node --check js/brussels-ui.js
          node --check js/brussels-postcodes.js
          node --check tests/brussels-postcodes.test.mjs
          node --check js/brx-geodata.js
          node --check js/road-network.js
          node --check tests/traffic-side.test.mjs
          node --check tools/build-geodata.mjs
          node --check tools/geo-brussels-areas.mjs
          node --check tools/geo-brussels-lines.mjs
          node --check js/geo-frame.js
          node --check js/brussels-terrain.js
          node --check js/brussels-colliders.js
          node --check tests/brussels-landmark-colliders.test.mjs
          node --check tests/brussels-terrain.test.mjs
          python -m py_compile tools/prepare-brussels-terrain.py tools/download-brussels-dtm.py tools/validate-brussels-dtm.py tests/brussels-terrain-importer.test.py tests/brussels-dtm-download.test.py tools/browser-runtime-smoke.py
      - name: Install terrain importer test dependencies
        run: |
          python -m pip install --only-binary=:all: -r tools/requirements-terrain.txt
      - name: Test WCS coverage discovery and numeric export request
        run: python tests/brussels-dtm-download.test.py
      - name: Download and validate live Brussels DTM (5 m)
        run: |
          python tools/download-brussels-dtm.py --resolution 5 --timeout 120 --output /tmp/brussels-dtm-5m.tif
          python tools/prepare-brussels-terrain.py /tmp/brussels-dtm-5m.tif --resolution 5 --output /tmp/brussels-terrain
          python tools/validate-brussels-dtm.py /tmp/brussels-terrain
      - name: Upload validated 5 m Brussels terrain grid
        uses: actions/upload-artifact@v4
        with:
          name: brussels-dtm-5m-${{ github.sha }}
          path: /tmp/brussels-terrain/
          if-no-files-found: error
          retention-days: 14
      - name: Test GeoTIFF to local terrain-grid importer
        run: python tests/brussels-terrain-importer.test.py
      - name: Parse GitHub Pages workflow YAML
        run: ruby -e "require 'yaml'; YAML.load_file('.github/workflows/deploy-brussels.yml')"
      - name: Test Brussels frame and anchors
        run: |
          node --test tests/brussels-frame.test.mjs tests/brussels-build-frame.test.mjs tests/traffic-side.test.mjs tests/boot.test.cjs tests/module-graph-audit.test.mjs tests/brussels-bus-selection.test.mjs tests/brussels-street-infrastructure.test.mjs tests/brussels-postcodes.test.mjs tests/brussels-terrain.test.mjs tests/brussels-landmark-colliders.test.mjs tests/scene-culling-math.test.mjs

  # Pull-request-only visual validation. No Pages/OIDC credentials are granted to this job.
  # Kept inside this established workflow so
  # GitHub runs it for this PR before a new workflow file has reached main.
  rendered-scenes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the pull request source
        uses: actions/checkout@v4
      - name: Check whether this PR includes the screenshot runner
        id: capture-runner
        run: |
          if test -f tools/browser-screenshots.mjs; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node.js
        if: steps.capture-runner.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python for Brussels terrain generation
        if: steps.capture-runner.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-terrain.txt
      # Source downloads (DTM, Geofabrik PBF) are cached separately from the
      # generated outputs, so a geodata-code change re-bakes without re-downloading.
      - name: Restore Brussels source downloads (DTM, OSM PBF)
        if: steps.capture-runner.outputs.present == 'true'
        id: source-cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/brussels-dtm-5m.tif
            tools/data/belgium-latest.osm.pbf
          key: brussels-source-v1-${{ hashFiles('tools/download-brussels-dtm.py', 'tools/requirements-terrain.txt') }}-geofabrik-belgium-latest
          restore-keys: |
            brussels-source-v1-
      - name: Restore generated Brussels geodata and terrain
        if: steps.capture-runner.outputs.present == 'true'
        id: build-cache
        uses: actions/cache@v4
        with:
          path: |
            data/brussels-terrain/
            data/brussels-build/
          key: brussels-build-v2-${{ hashFiles('tools/build-brussels-geodata.mjs', 'tools/build-geodata.mjs', 'tools/geo-brussels-*.mjs', 'tools/osm-pbf-extract.mjs', 'tools/prepare-brussels-terrain.py', 'tools/validate-brussels-dtm.py', 'js/brussels-terrain.js', 'js/brx-geodata.js') }}
      - name: Install terrain generation dependencies
        if: steps.capture-runner.outputs.present == 'true'
        run: |
          python -m pip install --only-binary=:all: -r tools/requirements-terrain.txt
      - name: Download the official Brussels DTM
        if: steps.capture-runner.outputs.present == 'true' && steps.source-cache.outputs.cache-hit != 'true'
        run: |
          python tools/download-brussels-dtm.py --resolution 5 --timeout 600 --output /tmp/brussels-dtm-5m.tif
      - name: Bake and validate the terrain grid
        if: steps.capture-runner.outputs.present == 'true' && steps.build-cache.outputs.cache-hit != 'true'
        run: |
          python tools/prepare-brussels-terrain.py /tmp/brussels-dtm-5m.tif --resolution 5 --output data/brussels-terrain
          python tools/validate-brussels-dtm.py data/brussels-terrain
      - name: Download the Belgium OpenStreetMap extract
        if: steps.capture-runner.outputs.present == 'true' && steps.source-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p tools/data
          curl --fail --location --retry 10 --retry-connrefused --retry-delay 5 --retry-max-time 300 --connect-timeout 30 --max-time 900 \
            https://download.geofabrik.de/europe/belgium-latest.osm.pbf \
            --output tools/data/belgium-latest.osm.pbf
      - name: Build Brussels geodata
        if: steps.capture-runner.outputs.present == 'true' && steps.build-cache.outputs.cache-hit != 'true'
        run: node --max-old-space-size=6144 tools/build-brussels-geodata.mjs
      - name: Validate generated Brussels geodata
        if: steps.capture-runner.outputs.present == 'true'
        run: |
          node tools/validate-brussels-geodata.mjs data/brussels-build
          node --test tests/geodata-brussels.test.mjs
      - name: Smoke-test the Brussels runtime
        if: steps.capture-runner.outputs.present == 'true'
        run: node tests/brussels-runtime-smoke.mjs
      - name: Stage the same static site and generated terrain used by Pages
        if: steps.capture-runner.outputs.present == 'true'
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='tools/' \
            --exclude='tests/' \
            --exclude='data/brussels-build/' \
            --exclude='BRUSSELS-PORT.md' \
            --exclude='*.md' \
            ./ _site/
          mkdir -p _site/data/brussels-build
          cp data/brussels-build/brx-geo.json data/brussels-build/brx-buildings.bin _site/data/brussels-build/
          mkdir -p _site/data/brussels-terrain
          cp data/brussels-terrain/metadata.json data/brussels-terrain/heightmap.f32 _site/data/brussels-terrain/
      - name: Cache Playwright npm package and Chromium binaries
        if: steps.capture-runner.outputs.present == 'true'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('tools/browser-screenshots.mjs', 'tools/shot.py') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright Chromium
        if: steps.capture-runner.outputs.present == 'true'
        run: |
          npm install --no-save playwright
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: Install ImageMagick for screenshot pixel validation
        if: steps.capture-runner.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick x11-apps xvfb
      - name: Start the staged site
        if: steps.capture-runner.outputs.present == 'true'
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory _site >/tmp/brussels-browser-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/brussels-browser-server.log
          exit 1
      - name: Capture and validate all six rendered Brussels views
        if: steps.capture-runner.outputs.present == 'true'
        run: xvfb-run --auto-servernum --server-args='-screen 0 1600x1000x24 -ac +extension GLX +render -noreset' node tools/browser-screenshots.mjs --base-url http://127.0.0.1:4173/
      - name: Upload screenshots and diagnostics, including partial failures
        if: always() && steps.capture-runner.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: brussels-rendered-scenes-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: artifacts/browser-screenshots/
          if-no-files-found: error
          retention-days: 14
