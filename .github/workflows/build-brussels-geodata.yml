name: Build Brussels geodata and smoke-test the runtime

on:
  workflow_dispatch:
  push:
    branches: ["feat/brussels-world-port"]
    paths: [".github/workflows/build-brussels-geodata.yml", "tools/validate-brussels-geodata.mjs", "tools/geo-brussels-areas.mjs", "tools/build-brussels-geodata.mjs", "tools/build-geodata.mjs", "tools/geo-brussels-lines.mjs", "tests/brussels-runtime-smoke.mjs"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/brussels-world-port
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Shares the brussels-source-v1 cache namespace with the deploy workflow, so the
      # multi-hundred-MB PBF is only downloaded when the downloader or Geofabrik file changes.
      - name: Restore Belgium OSM extract
        id: source-cache
        uses: actions/cache@v4
        with:
          path: tools/data/belgium-latest.osm.pbf
          key: brussels-source-v1-${{ hashFiles('tools/download-brussels-dtm.py', 'tools/requirements-terrain.txt') }}-geofabrik-belgium-latest
          restore-keys: |
            brussels-source-v1-
      - name: Download Belgium OpenStreetMap extract
        if: steps.source-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p tools/data
          curl --fail --location --retry 3 --retry-delay 2             https://download.geofabrik.de/europe/belgium-latest.osm.pbf             --output tools/data/belgium-latest.osm.pbf
          ls -lh tools/data/belgium-latest.osm.pbf
      - name: Extract and bake central Brussels
        run: node --max-old-space-size=6144 tools/build-brussels-geodata.mjs
      - name: Validate generated assets
        run: node tools/validate-brussels-geodata.mjs data/brussels-build
      - name: Smoke-test Brussels runtime and route graph
        run: node tests/brussels-runtime-smoke.mjs
      - name: Upload generated Brussels data for review
        uses: actions/upload-artifact@v4
        with:
          name: brussels-geodata-${{ github.run_number }}
          path: |
            data/brussels-build/brx-geo.json
            data/brussels-build/brx-buildings.bin
          if-no-files-found: error
          retention-days: 7
