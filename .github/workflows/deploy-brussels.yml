name: Deploy Brussels Loop to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main, "feat/*"]
    paths:
      - ".github/workflows/deploy-brussels.yml"
      - "index.html"
      - "css/**"
      - "js/**"
      - "data/**"
      - "vendor/**"
      - "tools/build-brussels-geodata.mjs"
      - "tools/download-brussels-dtm.py"
      - "tools/prepare-brussels-terrain.py"
      - "tools/validate-brussels-dtm.py"
      - "tools/requirements-terrain.txt"
      - "tools/validate-brussels-geodata.mjs"
      - "tests/brussels-runtime-smoke.mjs"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python for Brussels terrain generation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install terrain generation dependencies
        run: "python -m pip install --only-binary=:all: -r tools/requirements-terrain.txt"
      - name: Download and bake official Brussels DTM
        run: |
          python tools/download-brussels-dtm.py --resolution 5 --timeout 600 --output /tmp/brussels-dtm-5m.tif
          python tools/prepare-brussels-terrain.py /tmp/brussels-dtm-5m.tif --resolution 5 --output data/brussels-terrain
          python tools/validate-brussels-dtm.py data/brussels-terrain
      - name: Download Belgium OpenStreetMap extract
        run: |
          mkdir -p tools/data
          curl --fail --location --retry 3 --retry-delay 2 \
            https://download.geofabrik.de/europe/belgium-latest.osm.pbf \
            --output tools/data/belgium-latest.osm.pbf
      - name: Build Brussels geodata
        run: node --max-old-space-size=6144 tools/build-brussels-geodata.mjs
      - name: Validate generated map
        run: node tools/validate-brussels-geodata.mjs data/brussels-build
      - name: Smoke-test city config and GPS routing
        run: node tests/brussels-runtime-smoke.mjs
      - name: Test generated Brussels geodata contract
        run: node --test tests/geodata-brussels-base.test.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stage static site and set Brussels as the Pages default
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='tools/' \
            --exclude='tests/' \
            --exclude='data/brussels-build/' \
            --exclude='BRUSSELS-PORT.md' \
            --exclude='*.md' \
            ./ _site/
          mkdir -p _site/data/brussels-build
          cp data/brussels-build/brx-geo.json data/brussels-build/brx-buildings.bin _site/data/brussels-build/
          mkdir -p _site/data/brussels-terrain
          cp data/brussels-terrain/metadata.json data/brussels-terrain/heightmap.f32 _site/data/brussels-terrain/
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = '_site/index.html';
          let html = fs.readFileSync(file, 'utf8');
          const redirect = `<script>
          if (!new URLSearchParams(location.search).has('city')) {
            const url = new URL(location.href);
            url.searchParams.set('city', 'brussels');
            location.replace(url.href);
          }
          </script>`;
          if (!html.includes('url.searchParams.set(\'city\', \'brussels\')')) {
            html = html.replace('<head>', '<head>\n  ' + redirect);
            fs.writeFileSync(file, html);
          }
          NODE
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published site and Brussels assets
        run: |
          base="${{ steps.deployment.outputs.page_url }}"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-connrefused "$base" -o /tmp/index.html
          grep -Fq "url.searchParams.set('city', 'brussels')" /tmp/index.html
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-connrefused "${base%/}/js/city-config.js" | grep -q "brussels-config.js"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-connrefused "${base%/}/data/brussels-build/brx-geo.json" -o /dev/null
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-connrefused "${base%/}/data/brussels-terrain/metadata.json" -o /tmp/brussels-terrain-metadata.json
          node --input-type=module -e "import fs from 'node:fs'; const m=JSON.parse(fs.readFileSync('/tmp/brussels-terrain-metadata.json','utf8')); if(m.dataFile!=='heightmap.f32') throw new Error('Unexpected terrain data file');"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-connrefused "${base%/}/data/brussels-terrain/heightmap.f32" -o /dev/null
