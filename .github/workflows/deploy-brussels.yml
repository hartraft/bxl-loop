name: Deploy Brussels Loop to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-brussels.yml"
      - ".github/workflows/brussels-landmark-snapshots.yml"
      - "snapshot-grand-place.html"
      - "tools/shot.py"
      - "index.html"
      - "css/**"
      - "js/**"
      - "data/**"
      - "vendor/**"
      - "tools/build-brussels-geodata.mjs"
      - "tools/download-brussels-dtm.py"
      - "tools/prepare-brussels-terrain.py"
      - "tools/validate-brussels-dtm.py"
      - "tools/requirements-terrain.txt"
      - "tools/validate-brussels-geodata.mjs"
      - "tests/brussels-runtime-smoke.mjs"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python for Brussels terrain generation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-terrain.txt
      # Source downloads (DTM GeoTIFF, Geofabrik PBF) are cached separately from the
      # generated outputs, so a geodata-code change re-bakes without re-downloading
      # the multi-hundred-MB source files, and vice versa.
      - name: Restore Brussels source downloads (DTM, OSM PBF)
        id: source-cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/brussels-dtm-5m.tif
            tools/data/belgium-latest.osm.pbf
          key: brussels-source-v1-${{ hashFiles('tools/download-brussels-dtm.py', 'tools/requirements-terrain.txt') }}-geofabrik-belgium-latest
          restore-keys: |
            brussels-source-v1-
      - name: Restore generated Brussels geodata and terrain
        id: build-cache
        uses: actions/cache@v4
        with:
          path: |
            data/brussels-terrain/
            data/brussels-build/
          key: brussels-build-v2-${{ hashFiles('tools/build-brussels-geodata.mjs', 'tools/build-geodata.mjs', 'tools/geo-brussels-*.mjs', 'tools/osm-pbf-extract.mjs', 'tools/prepare-brussels-terrain.py', 'tools/validate-brussels-dtm.py', 'js/brussels-terrain.js', 'js/brx-geodata.js') }}
      - name: Install terrain generation dependencies
        run: "python -m pip install --only-binary=:all: -r tools/requirements-terrain.txt"
      - name: Download official Brussels DTM
        if: steps.source-cache.outputs.cache-hit != 'true'
        run: |
          python tools/download-brussels-dtm.py --resolution 5 --timeout 600 --output /tmp/brussels-dtm-5m.tif
      - name: Bake and validate terrain grid
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          python tools/prepare-brussels-terrain.py /tmp/brussels-dtm-5m.tif --resolution 5 --output data/brussels-terrain
          python tools/validate-brussels-dtm.py data/brussels-terrain
      - name: Download Belgium OpenStreetMap extract
        if: steps.source-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p tools/data
          curl --fail --location --retry 3 --retry-delay 2 \
            https://download.geofabrik.de/europe/belgium-latest.osm.pbf \
            --output tools/data/belgium-latest.osm.pbf
      - name: Build Brussels geodata
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: node --max-old-space-size=6144 tools/build-brussels-geodata.mjs
      - name: Validate generated map
        run: node tools/validate-brussels-geodata.mjs data/brussels-build
      - name: Smoke-test city config and GPS routing
        run: node tests/brussels-runtime-smoke.mjs
      - name: Test generated Brussels geodata contract
        run: node --test tests/geodata-brussels.test.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stage static site and set Brussels as the Pages default
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='tools/' \
            --exclude='tests/' \
            --exclude='data/brussels-build/' \
            --exclude='BRUSSELS-PORT.md' \
            --exclude='*.md' \
            ./ _site/
          mkdir -p _site/data/brussels-build
          cp data/brussels-build/brx-geo.json data/brussels-build/brx-buildings.bin _site/data/brussels-build/
          mkdir -p _site/data/brussels-terrain
          cp data/brussels-terrain/metadata.json data/brussels-terrain/heightmap.f32 _site/data/brussels-terrain/
      - name: Cache Playwright Chromium binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('tools/shot.py') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-
      - name: Install Playwright for published landmark snapshot
        run: |
          python -m pip install playwright pillow
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            python -m playwright install chromium
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Verify the staged site actually boots in Chromium/WebGPU
        run: |
          python -m http.server 4173 --bind 127.0.0.1 --directory _site >/tmp/brussels-runtime-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          python tools/browser-runtime-smoke.py http://127.0.0.1:4173/
      - name: Render the Grand-Place Town Hall PNG into the Pages site
        run: |
          mkdir -p _site/snapshots
          python -m http.server 4173 --directory _site > /tmp/pages-snapshot-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 30); do
            curl --fail http://localhost:4173/snapshot-grand-place.html >/dev/null && break || sleep 1
          done
          python tools/shot.py http://localhost:4173/snapshot-grand-place.html _site/snapshots/grand-place-town-hall.png 12 0.2
          test -s _site/snapshots/grand-place-town-hall.png
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Wait for the github-pages artifact to be visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # deploy-pages@v4 intermittently fails with "No artifacts named github-pages"
          # when the freshly uploaded artifact metadata is not yet visible — poll briefly.
          for i in $(seq 1 24); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length' | grep -q '^1$'; then
              echo "github-pages artifact visible"; exit 0
            fi
            sleep 5
          done
          echo "github-pages artifact still not visible after 2 minutes; continuing anyway"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published site and Brussels assets
        run: |
          base="${{ steps.deployment.outputs.page_url }}"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-connrefused "$base" -o /tmp/index.html
          grep -Fq "js/brussels-frame.js" /tmp/index.html
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-connrefused "${base%/}/js/city-config.js" | grep -q "brussels-config.js"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-connrefused "${base%/}/data/brussels-build/brx-geo.json" -o /dev/null
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-connrefused "${base%/}/data/brussels-terrain/metadata.json" -o /tmp/brussels-terrain-metadata.json
          node --input-type=module -e "import fs from 'node:fs'; const m=JSON.parse(fs.readFileSync('/tmp/brussels-terrain-metadata.json','utf8')); if(m.dataFile!=='heightmap.f32') throw new Error('Unexpected terrain data file');"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-connrefused "${base%/}/data/brussels-terrain/heightmap.f32" -o /dev/null
